name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/minha-aplicacao
  IMAGE_TAG: "2.0"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verificar a imagem com o endpoint /hello
        run: |
          docker run --rm --detach \
            --name minha-aplicacao-ci \
            --publish 8000:8000 \
            "$IMAGE_NAME:$IMAGE_TAG"
          trap 'docker rm --force minha-aplicacao-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/hello; then
              exit 0
            fi
            echo "Aguardando a aplicacao iniciar (tentativa $attempt/15)..."
            sleep 1
          done
          echo "A aplicacao nao respondeu. Logs do container:"
          docker logs minha-aplicacao-ci
          exit 1

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar a imagem no Docker Hub
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"
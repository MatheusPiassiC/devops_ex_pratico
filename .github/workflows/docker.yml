name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/minha-aplicacao
  IMAGE_TAG: "1.0"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verificar a imagem com o endpoint /hello
        run: |
          docker run --rm --detach \
            --name minha-aplicacao-ci \
            --publish 8000:8000 \
            "$IMAGE_NAME:$IMAGE_TAG"
          trap 'docker rm --force minha-aplicacao-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8000/hello

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar a imagem no Docker Hub
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"
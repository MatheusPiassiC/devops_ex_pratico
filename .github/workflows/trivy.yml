name: Trivy security scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos, dependencias e configuracoes
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Construir imagem para analise
        run: docker build --tag "minha-aplicacao:${{ github.sha }}" .

      - name: Gerar relatorio completo da imagem
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: minha-aplicacao:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Verificacao bloqueante da imagem
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: minha-aplicacao:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publicar relatorio de arquivos no GitHub
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Publicar relatorio da imagem no GitHub
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
